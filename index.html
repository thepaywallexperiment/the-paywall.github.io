<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="THE PAYWALL — a 30-day internet experiment. One video. The next slot costs twice as much.">
  <title>THE PAYWALL</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <main class="stage">
    <header class="brand">
      <h1>THE PAYWALL</h1>
    </header>

    <section class="reel" aria-label="Current video">
      <div class="frame" id="video-frame">
        <video
          id="current-video"
          controls
          playsinline
          autoplay
          preload="metadata"
          poster="assets/poster.svg"
        >
          <source id="video-source" src="" type="video/mp4">
        </video>
      </div>
      <nav class="socials" aria-label="Official profiles">
        <a class="social" id="social-tiktok" href="https://www.tiktok.com/@thepaywallexperiment" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.76-.13 2.89 2.89 0 0 1 2.88-2.88c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 0 0-.79-.05A6.34 6.34 0 0 0 3.15 15.3a6.34 6.34 0 0 0 12.68 0V8.73a8.2 8.2 0 0 0 4.76 1.51V6.79c-.34.02-.68 0-1-.1z"/>
          </svg>
        </a>
        <a class="social" id="social-instagram" href="https://www.instagram.com/the.paywall.experiment/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <circle cx="17.4" cy="6.6" r="1.15" fill="currentColor"/>
          </svg>
        </a>
        <a class="social" id="social-youtube" href="https://www.youtube.com/@ThePaywallExperiment/shorts" target="_blank" rel="noopener noreferrer" aria-label="YouTube Shorts">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6.2" y="2.4" width="11.6" height="19.2" rx="3.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path fill="currentColor" d="M10.3 8.4v7.2l6.1-3.6z"/>
          </svg>
        </a>
      </nav>
    </section>

    <section class="slot" aria-live="polite">
      <p class="slot-label" id="slot-label">SLOT #1</p>
      <p class="slot-price" id="slot-price">€1</p>
    </section>

    <div class="cta-wrap">
      <button type="button" class="cta" id="contribute-btn">
        CLAIM THIS SLOT
      </button>
      <p class="ended" id="experiment-ended" hidden>THE EXPERIMENT HAS ENDED</p>
      <p class="ended" id="slots-ended" hidden>ALL SLOTS HAVE BEEN CLAIMED</p>
    </div>
  </main>

  <footer class="site-footer">
    <a href="terms.html">Terms &amp; Conditions</a>
    <p>THE PAYWALL © <span id="year">2026</span></p>
  </footer>

  <div class="modal" id="pay-modal" hidden>
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <p class="modal-kicker" id="modal-title">NEXT TRANSMISSION</p>
      <p class="slot-label" id="modal-slot">SLOT #1</p>
      <p class="slot-price" id="modal-price">€1</p>
      <p class="modal-copy" id="modal-copy">You are claiming Slot #1 for €1.</p>
      <p class="modal-choose">Choose your payment method</p>
      <div class="pay-row">
        <button type="button" class="pay-btn" id="pay-card">CARD</button>
      </div>
      <p class="pay-note" id="pay-note" hidden></p>
      <a class="modal-terms" href="terms.html">Terms &amp; Conditions</a>
      <button type="button" class="cancel" id="modal-cancel">Cancel</button>
    </div>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
